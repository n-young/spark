name: PR 58867 focused regressions

on:
  push:
    branches:
      - stack/reyden-spark58867-focused-ci

permissions:
  contents: read
  actions: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPARK_LOCAL_IP: localhost
      SPARK_TESTING: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build-env
        with:
          java-version: 21
          coursier: restore
          free-disk-space: host
      - uses: actions/download-artifact@v8
        with:
          name: spark-compile-master-42824211975
          run-id: 42824211975
          github-token: ${{ github.token }}
      - name: Restore compiled classes
        run: |
          zstd -dc compile-artifact.tar.zst | tar -xf -
          rm compile-artifact.tar.zst
      - name: Run Catalyst review regression suites
        run: |
          ./build/sbt -Phadoop-3 -Pyarn -Pspark-ganglia-lgpl -Phadoop-cloud -Phive \
            -Pkubernetes -Pjvm-profiler -Pkinesis-asl -Pcredential-aws -Phive-thriftserver \
            -Pdocker-integration-tests -Pkubernetes-integration-tests -Pvolcano -Poidc-e2e \
            'catalyst/testOnly *PullOutNondeterministicSuite *MiscExpressionsSuite *RewriteWithExpressionSuite'
      - name: Run SQL review regression suites
        if: ${{ !cancelled() }}
        run: |
          ./build/sbt -Phadoop-3 -Pyarn -Pspark-ganglia-lgpl -Phadoop-cloud -Phive \
            -Pkubernetes -Pjvm-profiler -Pkinesis-asl -Pcredential-aws -Phive-thriftserver \
            -Pdocker-integration-tests -Pkubernetes-integration-tests -Pvolcano -Poidc-e2e \
            'sql/testOnly *MiscFunctionsSuite *GeneratedColumnWriteSuite'
      - name: Upload focused test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focused-58867-${{ github.run_id }}
          path: |
            sql/catalyst/target/test-reports/*.xml
            sql/core/target/test-reports/*.xml
